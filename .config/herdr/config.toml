onboarding = false

[theme]
name = "terminal"
auto_switch = true

[theme.custom.light]
accent = "#705800"
panel_bg = "#F3F8EF"
sidebar_bg = "#ECF1E8"
active_row_bg = "#DFE5CB"
selection_bg = "#CCD6B9"
surface0 = "#E7ECE3"
surface1 = "#D6DBD2"
surface_dim = "#ECF1E8"
overlay0 = "#A5AE9D"
overlay1 = "#606859"
text = "#363E30"
subtext0 = "#515A4B"
mauve = "#5E409D"
green = "#506A0C"
yellow = "#AD8301"
red = "#942921"
blue = "#005581"
teal = "#24837B"
peach = "#BC5215"

[theme.custom.dark]
accent = "#FBC701"
panel_bg = "#000000"
sidebar_bg = "#0B0B0B"
active_row_bg = "#181818"
selection_bg = "#1D2112"
surface0 = "#121212"
surface1 = "#202020"
surface_dim = "#000000"
overlay0 = "#717A6A"
overlay1 = "#AAB4A3"
text = "#D0DAC9"
subtext0 = "#AAB4A3"
mauve = "#A699D0"
green = "#B3CD6E"
yellow = "#ECCB60"
red = "#FF9786"
blue = "#75BFFF"
teal = "#5ABDAC"
peach = "#EC8B49"

# Highlights, borders, navigate chrome — separate from theme.custom.accent.
# Does not follow auto_switch; bright gold works on the Leaf page and the black floor.
[ui]
accent = "#FBC701"
tab_bar_right = [
  { type = "command", command = "$HOME/.local/bin/ghr-status", interval_seconds = 15, timeout_seconds = 10 },
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [{ token = "$ghr", rules = [
    { starts_with = "✓", fg = "#568200" },
    { starts_with = "✗", fg = "#C43B2E" },
    { starts_with = "⊘", dim = true },
    { starts_with = "○", dim = true },
  ] }],
]

[ui.sidebar.agents]
rows = [["state_icon", "machine", "workspace", "tab"], ["agent"]]

[ui.toast]
delivery = "system"
delay_seconds = 1

[keys]
previous_workspace = "prefix+shift+p"
next_workspace = "prefix+shift+n"
switch_workspace = "prefix+shift+1..9"
new_workspace = "prefix+shift+c"
open_notification_target = ""

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "100%"
height = "100%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+alt+r"
type = "popup"
command = "$HOME/.local/bin/ghr"
description = "trigger GitHub workflow"
width = 64
height = 22

[[keys.command]]
key = "prefix+o"
type = "shell"
command = "$HOME/.local/bin/herdr-focus-attention"
description = "focus agent needing attention"
