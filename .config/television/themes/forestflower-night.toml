# Forest Flower NIGHT for television (tv)
#
# Hex variant with true DESIGN.md tokens — fixes the ANSI theme's one
# compromise (gray selection bar). The cursor row is flaneur's recipe:
# surface.raised row + accent.action text ("the current one among many").
#
# ~/.config/television/themes/forestflower.toml is a symlink that the
# appearance watcher (extras/sketchybar/theme.sh) re-points between this
# file and forestflower-day.toml when macOS flips light/dark.

# general
background = "#121212"       # surface0 — panel tint so popups stand off the black floor
border_fg = "#575653"        # visible 1px border tier (same as sketchybar popup borders)
text_fg = "#D0DAC9"          # ink.primary
dimmed_text_fg = "#8F9988"   # ink.comment — captions / meta
# input
input_text_fg = "#D0DAC9"    # typed query = body ink
result_count_fg = "#717A6A"  # ink.faint
# results
result_name_fg = "#D0DAC9"   # rows = ink.primary, no accent hue
result_line_number_fg = "#717A6A"
result_value_fg = "#3AA99F"  # cyan values
selection_bg = "#181818"     # surface.raised — the cursor row (was gray!)
selection_fg = "#FBC701"     # accent.action — state.active gold
match_fg = "#FBC701"         # matches = action gold
# preview
preview_title_fg = "#4385BE"
# mode pills — accent fill + on-action ink
channel_mode_fg = "#000000"
channel_mode_bg = "#FBC701"
remote_control_mode_fg = "#000000"
remote_control_mode_bg = "#4385BE"
action_picker_mode_fg = "#000000"
action_picker_mode_bg = "#3AA99F"
